services:  
  etl:
    build:
      context: "./etl"
      target: "development"
    environment:
      - "APP_HOST=0.0.0.0"
      - "APP_PORT=80"
      - "APP_PIPELINE__TAXI_ZONES_FILE=/opt/app/data/taxi_zones.shp"
    env_file:
      - ".env"
    volumes:
      - "./data/taxi_zones.shp:/opt/app/data/taxi_zones.shp:ro"
      - "./data/taxi_zones.shx:/opt/app/data/taxi_zones.shx:ro"
      - "./data/taxi_zones.sbx:/opt/app/data/taxi_zones.sbx:ro"
      - "./data/taxi_zones.dbf:/opt/app/data/taxi_zones.dbf:ro"
      - "./data/taxi_zones.prj:/opt/app/data/taxi_zones.prj:ro"
      - "./data/taxi_zones.sbn:/opt/app/data/taxi_zones.sbn:ro"
      - "./data/taxi_zones.shp.xml:/opt/app/data/taxi_zones.shp.xml:ro"
    ports:
      - "127.0.0.1:9002:80"
  
  loader:
    build:
      context: "./loader"
      target: "development"
    environment:
      - "APP_HOST=0.0.0.0"
      - "APP_PORT=80"
      - "APP_LOADER__CSV_PATH=/opt/app/data/taxi.csv"
    env_file:
      - ".env"
    volumes:
      - "./data/taxi.csv:/opt/app/data/taxi.csv:ro"
    ports:
      - "127.0.0.1:9003:80"
  
  grafana:
    image: "grafana/grafana"
    volumes:
      - "grafana:/var/lib/grafana"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  grafana: {}
